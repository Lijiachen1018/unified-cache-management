# This workflow will upload a Python Package to Release asset
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

# Needed to create release and upload assets
permissions:
  contents: write

jobs:
  release:
    # Retrieve tag and create release
    name: Create Release to github
    runs-on: self-hosted
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract branch info
        shell: bash
        run: |
          echo "release_tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      - name: Create Release
        id: create_release
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RELEASE_TAG: ${{ env.release_tag }}
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const script = require('.github/workflows/scripts/create_release.js')
            await script(github, context, core)

  wheel:
    env:
      HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
    name: Build Wheel
    runs-on: self-hosted
    needs: release
    strategy:
      fail-fast: false
      matrix:
          os: ['ubuntu-20.04']
          python-version: ['3.12']
          pytorch-version: ['2.7.0']  # Must be the most recent version that meets requirements/cuda.txt.
          cuda-version: ['12.8.1']
          vllm-version: ['0.9.2']

    steps:
      - uses: actions/checkout@v4
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: build wheel and upload to TestPyPI
        run: |
          echo "github.workspace: ${{ github.workspace }}"
          ls -la ${{ github.workspace }}
          docker run --rm \
            --gpus all \
            -v ${{ github.workspace }}:/workspace/unified-cache-management \
            -w /workspace/unified-cache-management \
            --entrypoint /bin/bash \
            vllm/vllm-openai:v0.9.2 \
            -c "
              git config --global http.sslVerify false
              git config --global http.proxy ${{ secrets.HTTP_PROXY }}
              git config --global https.proxy ${{ secrets.HTTPS_PROXY }}
              git config --global http.version HTTP/1.1
              set -euo pipefail
              export PLATFORM=cuda
              python3 setup.py bdist_wheel
              echo "upgrade pip"
              pip install --upgrade pip --proxy ${{ secrets.HTTP_PROXY }} -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
              pip install twine --proxy ${{ secrets.HTTP_PROXY }} -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
              echo "[testpypi]" >> "~/.pypirc"
              echo "username=__token__" >> "~/.pypirc"
              echo "password=${{ secrets.TEST_PYPI_API_TOKEN }}" >> "~/.pypirc"
              HTTP_PROXY=${{ secrets.HTTP_PROXY }} python3 -m twine upload --repository testpypi --skip-existing dist/*
            "
      - name: find whl
        id: find_whl
        run: |
          path=$(basename $(find ${{ github.workspace }} -name "*.whl" -type f)) 
          echo "whl_path=${path}" >> $GITHUB_OUTPUT
      - name: Download whl
        run: |
           curl -L -O https://test.pypi.org/simple/uc-manager/${{ steps.find_whl.outputs.whl_path }}
      - name: Upload .whl to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.find_whl.outputs.whl_path }} # Path to your .whl file(s)
          tag: ${{ github.ref_name }} # Use the release tag as the target
          overwrite: true # Overwrite if the asset already exists
  
